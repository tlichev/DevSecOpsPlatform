version: '3.9'

# Management network note:
# The EVE-NG lab management range (192.168.100.0/24) must be routable from the
# Docker host. Add a static route on the host pointing 192.168.100.0/24 to the
# EVE-NG management interface before starting the stack.
# On Linux: ip route add 192.168.100.0/24 via <eve-ng-mgmt-ip>

x-django-env: &django-env
  env_file:
    - .env
  environment:
    - DJANGO_SETTINGS_MODULE=config.settings.dev
    - REDIS_URL=redis://redis:6379/0

x-django-volumes: &django-volumes
  volumes:
    - .:/app                          # bind-mount source — no rebuild needed on code changes
    - db_volume:/app/db               # named volume overlays /app/db (SQLite, persistent)
    - static_volume:/app/staticfiles  # named volume overlays /app/staticfiles
    - media_volume:/app/mediafiles    # named volume overlays /app/mediafiles

services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    <<: [*django-env, *django-volumes]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - netops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info --concurrency=4 -Q default,provisioning,monitoring,discovery
    <<: [*django-env, *django-volumes]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - netops
      - mgmt
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    <<: [*django-env, *django-volumes]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - netops
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - netops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.50.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - netops
      - mgmt
    restart: unless-stopped

  snmp_exporter:
    image: prom/snmp-exporter:v0.25.0
    volumes:
      - ./snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    ports:
      - "9116:9116"
    networks:
      - netops
      - mgmt
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.7.0
    ports:
      - "9100:9100"
    networks:
      - netops
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  grafana:
    image: grafana/grafana:10.3.3
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    ports:
      - "3000:3000"
    networks:
      - netops
    restart: unless-stopped
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - netops
    restart: unless-stopped

volumes:
  db_volume:
  static_volume:
  media_volume:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  netops:
    driver: bridge
  mgmt:
    driver: bridge
    # Containers in this network need host routing to reach 192.168.100.0/24
