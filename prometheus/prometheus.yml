global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'netops-platform'
    environment: 'dev'
 
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
 
rule_files:
  - /etc/prometheus/rules/*.yml
 
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
 
  # Node Exporter (Docker host)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
 
  # Django application metrics
  - job_name: 'django'
    static_configs:
      - targets: ['django:8000']
    metrics_path: '/metrics'
 
  # ── SNMP: Sofia Site ──────────────────────────────────────────────────────
  - job_name: cisco_switches
    metrics_path: /snmp
    params:
      module: [cisco_switch]
      auth: [cisco_v2]
    static_configs:
      - targets:
          - 192.168.1.100
          - 192.168.1.101
          - 192.168.1.102
          - 192.168.1.109
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter1:9116
 
 
 
