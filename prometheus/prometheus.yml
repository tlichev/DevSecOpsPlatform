global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 20s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host machine metrics
  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]

  # SNMP — Cisco IOSv routers/switches (one entry per device)
  - job_name: snmp_cisco
    static_configs:
      - targets:
          - 192.168.100.1   # R1 - Edge Router
          - 192.168.100.2   # FW
          - 192.168.100.10  # Core-SW
          - 192.168.100.11  # SW1
          - 192.168.100.12  # SW2
    metrics_path: /snmp
    params:
      module: [cisco_ios]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp_exporter:9116

  # Django application metrics (if django-prometheus added later)
  - job_name: django
    static_configs:
      - targets: ["django:8000"]
    metrics_path: /metrics
