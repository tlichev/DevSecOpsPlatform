  - job_name: 'snmp_sofia_router'
    static_configs:
      - targets: ['192.168.1.100']
    metrics_path: /snmp
    params:
      module: [cisco_switch]
      auth:   [public_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter1:9116
      - target_label: site
        replacement: sofia
      - target_label: role
        replacement: router
 
