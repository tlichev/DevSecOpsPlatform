{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — NetOps Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59,130,246,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Blue glow orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-orb-1 {
            width: 400px; height: 400px;
            background: rgba(59,130,246,.12);
            top: -100px; left: -100px;
            animation: float-orb 8s ease-in-out infinite;
        }
        .glow-orb-2 {
            width: 300px; height: 300px;
            background: rgba(168,85,247,.08);
            bottom: -80px; right: -80px;
            animation: float-orb 10s ease-in-out infinite reverse;
        }
        @keyframes float-orb {
            0%, 100% { transform: translate(0,0); }
            50%       { transform: translate(30px, 20px); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 24px 64px rgba(0,0,0,.6);
            animation: card-enter .4s cubic-bezier(.4,0,.2,1);
        }
        @keyframes card-enter {
            from { opacity:0; transform: translateY(20px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo-icon {
            font-size: 40px;
            color: var(--blue);
            filter: drop-shadow(0 0 16px rgba(59,130,246,.6));
            display: block;
            margin-bottom: 12px;
        }
        .login-logo-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -.5px;
        }
        .login-logo-title span { color: var(--blue); }
        .login-logo-sub {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .form-label {
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
            margin-bottom: 6px;
            display: block;
        }

        .input-group-dark {
            position: relative;
            margin-bottom: 18px;
        }
        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 11px 14px 11px 40px;
            font-size: 14px;
            font-family: var(--font);
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,.18);
        }
        .form-input::placeholder { color: var(--text-muted); }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 15px;
            transition: color .15s;
        }
        .password-toggle:hover { color: var(--text); }

        .btn-login {
            width: 100%;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            margin-top: 8px;
            transition: background .2s, transform .1s, box-shadow .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 0 0 rgba(59,130,246,.4);
        }
        .btn-login:hover {
            background: #2563eb;
            box-shadow: 0 0 20px rgba(59,130,246,.3);
            transform: translateY(-1px);
        }
        .btn-login:active { transform: none; }

        .login-error {
            background: var(--red-dim);
            border: 1px solid rgba(239,68,68,.3);
            color: #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .login-footer p {
            font-size: 11.5px;
            color: var(--text-muted);
            margin: 0;
        }
        .login-version {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            font-size: 10.5px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-cpu-fill login-logo-icon"></i>
            <div class="login-logo-title">NetOps <span>Platform</span></div>
            <div class="login-logo-sub">DevSecOps · Network Automation</div>
        </div>

        {% if messages %}
        {% for msg in messages %}
        <div class="login-error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            {{ msg }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}

            <label class="form-label" for="id_username">Username</label>
            <div class="input-group-dark">
                <i class="bi bi-person-fill input-icon"></i>
                <input
                    type="text"
                    id="id_username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your username"
                    autocomplete="username"
                    autofocus
                    required
                >
            </div>

            <label class="form-label" for="id_password">Password</label>
            <div class="input-group-dark">
                <i class="bi bi-lock-fill input-icon"></i>
                <input
                    type="password"
                    id="id_password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button type="button" class="password-toggle" id="pw-toggle" tabindex="-1">
                    <i class="bi bi-eye-slash" id="pw-icon"></i>
                </button>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i>
                Sign In
            </button>
        </form>

        <div class="login-footer">
            <p>Network Enterprise Infrastructure Automation</p>
            <div class="login-version">v1.0.0-dev · EVE-NG Integration</div>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('pw-toggle');
        const input  = document.getElementById('id_password');
        const icon   = document.getElementById('pw-icon');
        toggle.addEventListener('click', () => {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye' : 'bi bi-eye-slash';
        });
    </script>
</body>
</html>
